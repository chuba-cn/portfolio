<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NoThrow — type-safe error handling for TypeScript">
  <rect width="640" height="400" rx="14" fill="#16131f" />
  <rect x="0" y="0" width="640" height="52" rx="14" fill="#1f1b2e" />
  <rect x="0" y="38" width="640" height="14" fill="#1f1b2e" />
  <circle cx="28" cy="26" r="6" fill="#ff5f56" />
  <circle cx="50" cy="26" r="6" fill="#ffbd2e" />
  <circle cx="72" cy="26" r="6" fill="#27c93f" />
  <text x="320" y="31" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8c86a0">nothrow-ts</text>

  <g font-family="ui-monospace, 'Geist Mono', Menlo, monospace" font-size="17">
    <text x="34" y="96" fill="#7a7392">1</text>
    <text x="64" y="96" fill="#c084fc">import</text>
    <text x="130" y="96" fill="#e7e3f4">{ Ok, Err, Result }</text>
    <text x="316" y="96" fill="#c084fc">from</text>
    <text x="364" y="96" fill="#58e6d9">"nothrow-ts"</text>

    <text x="34" y="146" fill="#7a7392">2</text>

    <text x="34" y="176" fill="#7a7392">3</text>
    <text x="64" y="176" fill="#c084fc">function</text>
    <text x="156" y="176" fill="#82aaff">divide</text>
    <text x="216" y="176" fill="#e7e3f4">(a, b):</text>
    <text x="300" y="176" fill="#58e6d9">Result&lt;number&gt;</text>
    <text x="452" y="176" fill="#e7e3f4">{</text>

    <text x="34" y="206" fill="#7a7392">4</text>
    <text x="84" y="206" fill="#c084fc">if</text>
    <text x="112" y="206" fill="#e7e3f4">(b === 0)</text>
    <text x="218" y="206" fill="#c084fc">return</text>
    <text x="286" y="206" fill="#82aaff">Err</text>
    <text x="316" y="206" fill="#e7e3f4">(</text>
    <text x="326" y="206" fill="#58e6d9">"div/0"</text>
    <text x="396" y="206" fill="#e7e3f4">)</text>

    <text x="34" y="236" fill="#7a7392">5</text>
    <text x="84" y="236" fill="#c084fc">return</text>
    <text x="152" y="236" fill="#82aaff">Ok</text>
    <text x="174" y="236" fill="#e7e3f4">(a / b)</text>

    <text x="34" y="266" fill="#7a7392">6</text>
    <text x="64" y="266" fill="#e7e3f4">}</text>

    <text x="34" y="296" fill="#7a7392">7</text>
    <text x="64" y="296" fill="#5a5470">// no exceptions. errors are values.</text>
  </g>

  <g>
    <text x="34" y="356" font-family="ui-monospace, 'Geist Mono', Menlo, monospace" font-size="30" font-weight="700" fill="#f5f5f5">No<tspan fill="#c084fc">Throw</tspan></text>
    <text x="34" y="380" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#8c86a0">Result &amp; Option types for TypeScript, inspired by Rust</text>
  </g>
</svg>
